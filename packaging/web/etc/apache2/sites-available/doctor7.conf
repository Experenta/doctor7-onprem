# doctor7-onprem virtual host.
#
# The values below are Apache variables. They are set in /etc/doctor7/web.vars.conf:
#   SERVER_NAME     host name of the site, as the browser uses it
#   JITSI_ORIGIN    origin of the Jitsi server, such as https://meet.demo.example.test.
#                   It is not the origin of the site. The frame-src policy and the
#                   camera and microphone permissions use it, so an iframe from any
#                   other origin is blocked.
#   TLS_CERT_FILE   full chain certificate file
#   TLS_KEY_FILE    private key file
#   API_UPSTREAM    host:port of the API (the PORT setting of the API)
#
# Needed modules: proxy, proxy_http, proxy_wstunnel, headers, rewrite, deflate,
# expires, ssl. The doctor7-web package enables them.
# Enable the site with: a2ensite doctor7 && apache2ctl configtest && systemctl reload apache2

Include /etc/doctor7/web.vars.conf

<VirtualHost *:80>
    ServerName ${SERVER_NAME}
    Redirect permanent / "https://${SERVER_NAME}/"
</VirtualHost>

<VirtualHost *:443>
    ServerName ${SERVER_NAME}
    DocumentRoot /usr/share/doctor7/web

    ErrorLog ${APACHE_LOG_DIR}/doctor7-error.log
    CustomLog ${APACHE_LOG_DIR}/doctor7-access.log combined

    # TLS
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile ${TLS_CERT_FILE}
    SSLCertificateKeyFile ${TLS_KEY_FILE}

    # Security headers on every response.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Permissions-Policy "camera=(self \"${JITSI_ORIGIN}\"), microphone=(self \"${JITSI_ORIGIN}\")"

    # Content policy for the HTML. No inline script or style is allowed.
    <FilesMatch "\.html$">
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://${SERVER_NAME}; frame-src 'self' ${JITSI_ORIGIN}; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
        Header always set Cache-Control "no-cache"
    </FilesMatch>

    # Static files
    <Directory /usr/share/doctor7/web>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Build output has hashed names, so it can be cached for a long time.
    <Directory /usr/share/doctor7/web/assets>
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header append Cache-Control "public, immutable"
    </Directory>

    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml

    # Client routing: a path without a file gets index.html. /api, /ws and /idp
    # are excluded. /idp is the demo identity provider (packaging/apache/idp-demo.conf.example).
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/(api|ws|idp)(/|$)
    RewriteCond %{REQUEST_URI} !^/assets/
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule ^ /index.html [L]

    # API. The prefix is removed: /api/auth/me reaches the API as /auth/me.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass "/api/" "http://${API_UPSTREAM}/"
    ProxyPassReverse "/api/" "http://${API_UPSTREAM}/"
    # The API sets the sign-in cookie with Path=/auth and the session cookie with
    # Path=/. The sign-in attempt travels under /api/auth, so Apache maps /auth to
    # /api/auth, and the browser sends the sign-in cookie back to /api/auth/callback.
    # The session cookie keeps Path=/ on purpose: /ws has no prefix and must receive
    # it. A rule that maps / to /api/ would hide the session from /ws, and the chat
    # would answer 401.
    ProxyPassReverseCookiePath /auth /api/auth

    # Chat WebSocket, no prefix.
    ProxyPass "/ws" "ws://${API_UPSTREAM}/ws" timeout=3600
</VirtualHost>
