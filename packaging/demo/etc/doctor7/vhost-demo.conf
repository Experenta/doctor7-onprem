# doctor7-onprem demo: forwards /idp/ to the mock identity provider.
#
# Demo only. Do not install this on a production server.
#
# doctor7-demo installs this file as /etc/doctor7/vhost-demo.conf. The TLS host of
# doctor7-web includes it with IncludeOptional, so no edit is needed. The provider
# listens on 127.0.0.1:4010 (packaging/demo/usr/lib/systemd/system/doctor7-mock-idp.service).
# Apache removes the /idp prefix before it forwards, and the provider answers with
# or without it. The public issuer is https://<host>/idp, so MOCK_IDP_PUBLIC_URL and
# OIDC_ISSUER must be exactly that value.
#
# Reload Apache after the install or the removal: apache2ctl configtest && systemctl reload apache2
#
# The example in packaging/apache/idp-demo.conf.example holds the same directives,
# with the TLS settings and the placeholder host.

ProxyRequests Off

<Location "/idp/">
    Require all granted
</Location>

ProxyPass /idp/ http://127.0.0.1:4010/
ProxyPassReverse /idp/ http://127.0.0.1:4010/
